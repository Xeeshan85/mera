name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Restore Firebase Android config
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON" ]; then
          echo "Missing GitHub secret GOOGLE_SERVICES_JSON. Add android/app/google-services.json contents as this secret."
          exit 1
        fi
        printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

    - name: Restore Google Maps key
      env:
        MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      run: |
        if [ -z "$MAPS_API_KEY" ]; then
          echo "Missing GitHub secret MAPS_API_KEY. Add your Google Maps Android API key so the APK can render real maps."
          exit 1
        fi
        printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > android/local.properties

    - name: Build Debug APK
      env:
        JAVA_TOOL_OPTIONS: ""
        _JAVA_OPTIONS: ""
        JAVA_OPTS: ""
        GRADLE_OPTS: ""
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: barwaqt-app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
